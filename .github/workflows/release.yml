name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate release and build once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tarball: ${{ steps.version.outputs.tarball }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate tag and lockfile version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs --check-tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Test, build and package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run pack:local -- --tag "$RELEASE_TAG"
      - name: Verify release checksums
        working-directory: artifacts
        run: sha256sum --check *.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-release
          path: |
            artifacts/*.tgz
            artifacts/*.tgz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  github-release:
    name: Publish GitHub release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-release
          path: artifacts
      - name: Verify downloaded assets
        working-directory: artifacts
        run: sha256sum --check *.sha256
      - name: Create release with installable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" artifacts/*.tgz artifacts/*.tgz.sha256 artifacts/*.zip artifacts/*.zip.sha256 \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"

  npm-publish:
    name: Publish npm package with OIDC
    needs: [build, github-release]
    if: vars.PUBLISH_TO_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-release
          path: artifacts
      - name: Verify downloaded assets
        working-directory: artifacts
        run: sha256sum --check *.sha256
      - name: Publish the same tarball distributed on GitHub
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: npm publish "artifacts/$TARBALL" --access public --ignore-scripts --tag "$DIST_TAG"